name: Test fail_on_error=false - formatted files succeed regardless
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify npm is available
        run: |
          node --version
          npm --version

      - id: action
        uses: .
        with:
          file_pattern: "${{ github.workspace }}/tests/fixtures/prettier/formatted/hello.js"
          config_path: "${{ github.workspace }}/tests/fixtures/prettier/.prettierrc"
          ignore_path: "${{ github.workspace }}/tests/fixtures/prettier/.prettierignore"
          fail_on_error: "false"

      - name: Assert action succeeded with formatted files
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.prettier_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prettier_output: '$OUTPUT'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when files are formatted, got '$OUTCOME'"
            exit 1
          fi
          # Output should be empty since all files are formatted
          if [ -n "$OUTPUT" ]; then
            echo "INFO: prettier flagged some files: $OUTPUT"
          else
            echo "INFO: no files flagged (all formatted correctly)"
          fi
          echo "PASS: action succeeded with fail_on_error=false"
